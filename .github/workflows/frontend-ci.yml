name: frontend

on:
  push:
    branches: [main]
    paths: ["frontend*/**", "tools/test-api-client.mjs", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["frontend*/**", "tools/test-api-client.mjs", ".github/workflows/frontend-ci.yml"]

permissions:
  contents: read

jobs:
  app:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, frontend-studio, frontend-user, frontend-toyxona]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Lint (after the build, so generated files are present and must be ignored)
        run: npm run lint
      - name: Unit tests
        if: matrix.app == 'frontend-user'
        run: npm test

  api-client-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: CSRF / network-recovery behaviour of all four API clients
        run: node tools/test-api-client.mjs
